<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="448" viewBox="0 0 1400 448">
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#a34e16"/></marker></defs>
  <g font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" fill="#231f20">
    <text x="32" y="48" font-size="30" font-weight="700">PHP 在執行 Moodle 之前先處理 request</text>
    <rect x="24" y="108" width="260" height="140" rx="6" fill="#fff1d6" stroke="#b8ada0" stroke-width="2"/>
    <text x="154.0" y="164" font-size="26" font-weight="700" text-anchor="middle">HTTP POST</text>
    <text x="154.0" y="210" font-size="21" text-anchor="middle" fill="#6b6258">multipart/form-data</text>
    <path d="M296 178H336" fill="none" stroke="#a34e16" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="348" y="108" width="300" height="140" rx="6" fill="#fff1d6" stroke="#b8ada0" stroke-width="2"/>
    <text x="498.0" y="164" font-size="26" font-weight="700" text-anchor="middle">PHP request startup</text>
    <text x="498.0" y="210" font-size="21" text-anchor="middle" fill="#6b6258">解析輸入、初始化 session</text>
    <path d="M660 178H700" fill="none" stroke="#a34e16" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="712" y="108" width="340" height="140" rx="6" fill="#ffe0b2" stroke="#b8ada0" stroke-width="2"/>
    <text x="882.0" y="164" font-size="26" font-weight="700" text-anchor="middle">Session Upload Progress</text>
    <text x="882.0" y="210" font-size="21" text-anchor="middle" fill="#6b6258">早期更新上傳進度狀態</text>
    <path d="M1064 178H1104" fill="none" stroke="#a34e16" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="1116" y="108" width="260" height="140" rx="6" fill="#fff1d6" stroke="#b8ada0" stroke-width="2"/>
    <text x="1246.0" y="164" font-size="26" font-weight="700" text-anchor="middle">Moodle code</text>
    <text x="1246.0" y="210" font-size="21" text-anchor="middle" fill="#6b6258">index.php 開始執行</text>
    <path d="M882 260V270" fill="none" stroke="#a34e16" stroke-width="2"/>
    <text x="882" y="304" font-size="22" text-anchor="middle" fill="#a34e16">這份 PoC 在這裡觸發 OOM，留下跨請求狀態</text>
    <text x="32" y="382" font-size="22" fill="#6b6258">session.upload_progress 是 PHP 的檔案上傳進度機制；本 Lab 啟用這項功能。</text>
    <text x="32" y="424" font-size="22" fill="#6b6258">漏洞發生在應用程式碼之前的 request startup；不是 Moodle 的 PHP 程式碼。</text>
  </g>
</svg>
